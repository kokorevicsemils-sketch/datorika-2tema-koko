<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASV robežsargi</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #350de7;
  color: #ec0909;
}

h1 {
  color: #f1efef;font-size: 36px;text-align: center;
}

.noteikumi {
  background-color: #07f3f3;
  color: #222222;
  padding: 16px;border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 5px solid #f02106;border-radius: 12px;
  background-color: #f8fafc;
  box-sizing: border-box;
  text-align: center;
  12px;margin: 20px auto;max-width: 100%;
  background-color: #f8fafc;
}

button {
  background-color: #c3f708;
  color: #ffffff;
  border: 0;border-radius: 8px;
}
</style>
</head>
<body>
<h1>ASV robežsargi</h1>
<p>Ķer meksikāņus un attīri ameriku!</p>

<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p> ķer meksikāņus, kas cenšās tikt pāri robežai!</p>
<p> vāc pēc iespējas vairāk punktus un glāb ameriku!</p>
<p> skaņas attēlo punktu iegūšanu un brīdina par briesmām!</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.png" alt="M.A.G.A. trumps" width="128">
  <p>Skaņas efekta nozīme spēlē:</p>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
